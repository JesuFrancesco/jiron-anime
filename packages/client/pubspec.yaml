name: jiron_anime
description: "Cliente móvil para el proyecto de Interacción Humano Computador (2025-1)."
publish_to: "none"
version: 1.0.2

environment:
  sdk: ^3.7.2

dependencies:
  animated_background: ^2.0.0
  async: ^2.12.0
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_local_notifications: ^19.1.0
  flutter_map: ^8.1.1
  flutter_native_splash: ^2.4.6
  get: ^4.7.2
  google_sign_in: ^6.3.0
  http: ^1.3.0
  http_status: ^3.3.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  location: ^8.0.0
  logger: ^2.5.0
  markdown_widget: ^2.3.2+8
  path: ^1.9.1
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/image/
    - assets/font/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/font/Rubik-Regular.ttf
        - asset: assets/font/Rubik-Italic.ttf
          style: italic
        - asset: assets/font/Rubik-Bold.ttf
          weight: 700

flutter_launcher_icons:
  # dart run flutter_launcher_icons
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FF503E"
  adaptive_icon_foreground: "assets/image/logo_centered.png"
  image_path: "assets/image/logo_centered.png"
  min_sdk_android: 21

flutter_native_splash:
  # dart run flutter_native_splash:create
  color: "#FF503E"
  color_dark: "#FF503E"

  image: assets/image/logo_centered.png
  image_dark: assets/image/logo_centered.png

  android_12:
    image: assets/image/logo_centered.png
    icon_background_color: "#FF503E"

    image_dark: assets/image/logo_centered.png
    icon_background_color_dark: "#FF503E"
